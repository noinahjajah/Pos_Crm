# รันทั้งระบบด้วย Docker: docker compose --profile web up -d --build · เปิดออกนอกแค่ gateway :8080 และเว็บ :8000
# โหมดพัฒนา (แก้โค้ดแล้ว reload เอง): ดู docker-compose.dev.yml
# แต่ละ service อ่าน .env ในโฟลเดอร์ของตัวเอง (services/<ชื่อ>/.env)

x-node-service: &node-service
  restart: unless-stopped
  networks: [internal]

services:
  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: gateway }
    env_file: ./services/gateway/.env
    environment:
      PORT: 8080
      IDENTITY_URL: http://identity:3001
      CATALOG_URL: http://catalog:3002
      POS_URL: http://pos:3003
      PAYMENT_URL: http://payment:3004
      MEMBERSHIP_URL: http://membership:3005
      TRUST_PROXY: "1"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      identity: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  identity:
    <<: *node-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: identity }
    env_file: ./services/identity/.env
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Dev 2
  catalog:
    <<: *node-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: catalog }
    env_file: ./services/catalog/.env
    environment:
      PORT: 3002
      POS_URL: http://pos:3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  payment:
    <<: *node-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: payment }
    env_file: ./services/payment/.env
    environment:
      PORT: 3004
      POS_URL: http://pos:3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # สมาชิกลูกค้า
  membership:
    <<: *node-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: membership }
    env_file: ./services/membership/.env
    environment:
      PORT: 3005
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Dev 3: โต๊ะ บิล จอครัว คำขออนุมัติ
  pos:
    <<: *node-service
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: pos }
    env_file: ./services/pos/.env
    environment:
      PORT: 3003
      CATALOG_URL: http://catalog:3002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # เว็บ (เปิดด้วย --profile web) · http://localhost:8000
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on: [gateway]
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}
