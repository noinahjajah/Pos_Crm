# POS CRM — Docker Compose ทั้งระบบ
# เปิดออกนอกแค่ gateway :8080 · service อื่นอยู่ใน network ภายในเท่านั้น
#
#   cp .env.example .env
#   docker compose up --build                 # gateway + identity (งาน Dev 1)
#   docker compose --profile all up --build   # ทุก service (เมื่อ Dev 2/3 เพิ่มโฟลเดอร์ services/catalog, pos, payment แล้ว)
#   docker compose --profile web up --build   # + เว็บที่ http://localhost:5173

x-node-service: &node-service
  env_file: .env
  restart: unless-stopped
  networks: [internal]

services:
  gateway:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { SERVICE: gateway }
    env_file: .env
    environment:
      PORT: 8080
      IDENTITY_URL: http://identity:3001
      CATALOG_URL: http://catalog:3002
      POS_URL: http://pos:3003
      PAYMENT_URL: http://payment:3004
      TRUST_PROXY: "1"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      identity: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  identity:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { SERVICE: identity }
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----- service ของ Dev 2 / Dev 3 (เปิดด้วย --profile all) -----
  catalog:
    <<: *node-service
    profiles: [all]
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { SERVICE: catalog }
    environment:
      PORT: 3002
      POS_URL: http://pos:3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  pos:
    <<: *node-service
    profiles: [all]
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { SERVICE: pos }
    environment:
      PORT: 3003
      CATALOG_URL: http://catalog:3002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  payment:
    <<: *node-service
    profiles: [all]
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { SERVICE: payment }
    environment:
      PORT: 3004
      POS_URL: http://pos:3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----- เว็บ (เปิดด้วย --profile web) — nginx เสิร์ฟไฟล์ build และส่ง /api ต่อให้ gateway -----
  web:
    profiles: [web]
    build:
      context: ./web
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        RUN npm run build
        FROM nginx:alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
    ports:
      - "5173:80"
    depends_on: [gateway]
    networks: [internal]

networks:
  internal: {}
