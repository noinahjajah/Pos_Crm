# รันทั้งหมด:  docker compose up -d --build
# โหมดพัฒนา (reload อัตโนมัติ): ดู docker-compose.dev.yml
# ก่อนรัน: copy services/<name>/.env.example → services/<name>/.env แล้วใส่ค่าจริง
name: pos-crm

services:
  # ทางเข้าเดียวจากข้างนอก — ตรวจ JWT + ตัดสินสิทธิ์จาก role (services/gateway/src/access.config.js)
  gateway:
    build: ./services/gateway
    env_file: ./services/gateway/.env
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - catalog
      - payment
    restart: unless-stopped

  # login · ผู้ใช้ · สาขา (Dev 1) — schema identity1
  identity:
    build: ./services/identity
    env_file: ./services/identity/.env
    environment:
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  catalog:
    build: ./services/catalog
    env_file: ./services/catalog/.env
    environment:
      PORT: 3002
      IDENTITY_URL: http://identity:3001
    depends_on:
      - identity
    # ตามเอกสาร gateway: service ไม่ควรเปิดออกนอก — เปิดเฉพาะ localhost ไว้ทดสอบตอน dev
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped

  payment:
    build: ./services/payment
    env_file: ./services/payment/.env
    environment:
      PORT: 3004
      POS_URL: http://pos:3003
      IDENTITY_URL: http://identity:3001
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      - identity
      - catalog
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8000:80"
    restart: unless-stopped

  # TODO: เพิ่ม pos (:3003) เมื่อโค้ดพร้อม (ระหว่างนี้ gateway ตอบ 502 ให้ route ของ pos)
