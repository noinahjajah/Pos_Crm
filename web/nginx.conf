server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ใช้ DNS ของ docker + ตัวแปร เพื่อให้ nginx เปิดได้แม้ gateway ยังไม่รัน
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ส่ง /api/* ต่อให้ API Gateway (:8080) ซึ่งเป็นคนตรวจ JWT และใส่ X-Internal-Key
    location /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # SPA fallback: send unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
