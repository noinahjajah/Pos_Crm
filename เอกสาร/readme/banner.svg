<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="POS &amp; CRM ระบบขายหน้าร้าน 3 สาขา" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1C1A"/>
      <stop offset="1" stop-color="#2A2724"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E6B5A"/>
      <stop offset="1" stop-color="#3F8C76"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#F4F2EE" opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .th { font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', Tahoma, sans-serif; }
      .en { font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <circle cx="1180" cy="-40" r="260" fill="#2E6B5A" opacity="0.22"/>
  <circle cx="1240" cy="420" r="180" fill="#B5481E" opacity="0.16"/>

  <!-- ข้อความซ้าย -->
  <g transform="translate(72,0)">
    <rect y="72" width="168" height="34" rx="17" fill="#2E6B5A" opacity="0.9"/>
    <text x="84" y="95" text-anchor="middle" class="en" font-size="15" font-weight="600" fill="#F4F2EE" letter-spacing="1.5">CSI400 · PHASE 1</text>

    <text y="172" class="en" font-size="64" font-weight="700" fill="#F4F2EE">POS <tspan fill="#5FB59B">&amp;</tspan> CRM</text>
    <text y="222" class="th" font-size="30" font-weight="600" fill="#F4F2EE" opacity="0.92">ระบบขายหน้าร้าน 3 สาขา</text>
    <text y="262" class="th" font-size="19" fill="#F4F2EE" opacity="0.62">ร้านอาหาร · ร้านเครื่องดื่ม · บาร์ — โต๊ะ ครัว คิดเงิน อนุมัติ สต็อก รายงาน</text>

    <g transform="translate(0,300)" class="en" font-size="14" font-weight="600">
      <rect width="108" height="32" rx="8" fill="#F4F2EE" opacity="0.08"/>
      <text x="54" y="21" text-anchor="middle" fill="#F4F2EE" opacity="0.85">React 19</text>
      <rect x="118" width="108" height="32" rx="8" fill="#F4F2EE" opacity="0.08"/>
      <text x="172" y="21" text-anchor="middle" fill="#F4F2EE" opacity="0.85">Express 5</text>
      <rect x="236" width="108" height="32" rx="8" fill="#F4F2EE" opacity="0.08"/>
      <text x="290" y="21" text-anchor="middle" fill="#F4F2EE" opacity="0.85">Supabase</text>
      <rect x="354" width="108" height="32" rx="8" fill="#F4F2EE" opacity="0.08"/>
      <text x="408" y="21" text-anchor="middle" fill="#F4F2EE" opacity="0.85">Docker</text>
      <rect x="472" width="140" height="32" rx="8" fill="#F4F2EE" opacity="0.08"/>
      <text x="542" y="21" text-anchor="middle" fill="#F4F2EE" opacity="0.85">Microservices</text>
    </g>
  </g>

  <!-- การ์ดใบเสร็จด้านขวา -->
  <g transform="translate(860,58) rotate(3)" filter="url(#shadow)">
    <rect width="300" height="284" rx="18" fill="#F4F2EE"/>
    <rect width="300" height="56" rx="18" fill="url(#green)"/>
    <rect y="38" width="300" height="18" fill="url(#green)"/>
    <text x="24" y="35" class="th" font-size="17" font-weight="700" fill="#F4F2EE">โต๊ะ A2 · บิล #B261123</text>
    <g class="th" font-size="15" fill="#1E1C1A">
      <text x="24" y="92">กะเพรา + ไข่ดาว × 2</text><text x="276" y="92" text-anchor="end" class="en">140.00</text>
      <text x="24" y="122">ข้าวผัดปู</text><text x="276" y="122" text-anchor="end" class="en">85.00</text>
      <text x="24" y="152">ชาเย็น · ไข่มุก</text><text x="276" y="152" text-anchor="end" class="en">60.00</text>
    </g>
    <line x1="24" y1="170" x2="276" y2="170" stroke="#1E1C1A" stroke-opacity="0.15" stroke-dasharray="4 4"/>
    <g class="th" font-size="14" fill="#1E1C1A" opacity="0.6">
      <text x="24" y="194">VAT 7%</text><text x="276" y="194" text-anchor="end" class="en">19.95</text>
    </g>
    <text x="24" y="230" class="th" font-size="18" font-weight="700" fill="#1E1C1A">สุทธิ</text>
    <text x="276" y="230" text-anchor="end" class="en" font-size="22" font-weight="700" fill="#2E6B5A">฿304.95</text>
    <rect x="24" y="246" width="252" height="24" rx="12" fill="#2E6B5A" opacity="0.12"/>
    <text x="150" y="263" text-anchor="middle" class="th" font-size="13" font-weight="600" fill="#2E6B5A">✓ ชำระแล้ว · เงินสด</text>
  </g>

  <!-- ป้ายอนุมัติ -->
  <g transform="translate(704,322)" filter="url(#shadow)">
    <rect width="196" height="58" rx="14" fill="#FFFFFF"/>
    <circle cx="30" cy="29" r="15" fill="#B5481E"/>
    <text x="30" y="34" text-anchor="middle" class="en" font-size="15" font-weight="700" fill="#FFF">%</text>
    <text x="56" y="25" class="th" font-size="13" font-weight="700" fill="#1E1C1A">ขอส่วนลด 10%</text>
    <text x="56" y="43" class="th" font-size="12" fill="#1E1C1A" opacity="0.55">รออนุมัติจากผู้จัดการ</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
